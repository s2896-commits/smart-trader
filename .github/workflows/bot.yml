name: Smart Trader Cloud Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'database.py'
      - 'bot_engine.py'
      - 'main.py'
      - 'gh_runner.py'

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: سحب ملفات البوت
        uses: actions/checkout@v4

      - name: تجهيز بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل الفحص وتحديث الشاشة
        run: python gh_runner.py

      - name: حفظ الصفقات والشاشة المحدثة
        run: |
          git config user.name "SM-A-X Bot"
          git config user.email "bot@smax.local"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update trades & Grok dashboard"
          git push
