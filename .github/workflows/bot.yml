name: Smart Trader Cloud Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Bot & Build Dashboard
        run: python gh_runner.py

      - name: Save & Push
        run: |
          git config user.name "SM-A-X Bot"
          git config user.email "bot@smax.local"
          touch docs/.nojekyll
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update trades & dashboard"
          git push
